<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Initial setup · Institute Laboratory Services</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="/static/style.css"></head><body class="login-page"><div class="login-box"><div class="seal large">I</div><p class="eyebrow">INITIAL ADMINISTRATOR SETUP</p><h1>Set up the portal</h1><p class="text-secondary">Create the first administrator account. Get the setup key from the Render environment variable named <code>SECRET_KEY</code>.</p>{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}<form method="post"><label class="form-label">Setup key</label><input class="form-control mb-3" name="setup_key" type="password" autocomplete="off" required><label class="form-label">Administrator name</label><input class="form-control mb-3" name="name" required><label class="form-label">Email</label><input class="form-control mb-3" name="email" type="email" required><label class="form-label">New password (12+ characters)</label><input class="form-control mb-4" name="password" type="password" minlength="12" required><button class="btn btn-primary w-100">Create administrator</button></form><a class="d-block mt-3" href="/login">Return to sign in</a></div></body></html>
